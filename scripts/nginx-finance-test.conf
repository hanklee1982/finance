server {
    listen 80;
    server_name opnai.dcool.com;
    
    # Frontend static files
    root /opt/finance-test/finance/frontend/dist;
    index index.html;
    
    # API reverse proxy
    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1/Report" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}

# HTTPS Configuration (auto-generated by Let's Encrypt)
server {
    listen 443 ssl;
    server_name opnai.dcool.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/opnai.dcool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opnai.dcool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Frontend static files
    root /opt/finance-test/finance/frontend/dist;
    index index.html;
    
    # API reverse proxy
    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1/Report" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name opnai.dcool.com;
    return 301 https://$server_name$request_uri;
}